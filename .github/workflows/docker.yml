name: Docker Publish (GHCR)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v1.0.0-cu132)"
        required: false
        default: "v1.0.0-cu132"
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}-cu132" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag || 'v1.0.0-cu132' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/samudragupto/cutile-forge:${{ steps.meta.outputs.tag }}
            ghcr.io/samudragupto/cutile-forge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
