name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff black mypy
      - run: ruff check cutile_forge/ benchmarks/ tests/
      - run: black --check cutile_forge/ benchmarks/ tests/
      - run: mypy cutile_forge/ --ignore-missing-imports

  unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" --no-build-isolation
      - run: pytest tests/ -v --tb=short --timeout=120

  correctness-tests:
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -e ".[dev]" --no-build-isolation
          python -m cutile_forge.baselines.build
          python models/download.py --output /mnt/d/models/mistral_7b_4bit/
      - run: pytest benchmarks/correctness/ -v --tb=short --timeout=600
      - run: pytest tests/ -v --tb=short

