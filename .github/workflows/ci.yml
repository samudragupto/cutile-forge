name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff black mypy
      - run: ruff check cutile_forge/ benchmarks/ tests/ examples/
      - run: black --check cutile_forge/ benchmarks/ tests/ examples/
      - run: mypy cutile_forge/ --ignore-missing-imports

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[cuda,dev,serve]"
      - run: pytest tests/ -v --tb=short --timeout=120
