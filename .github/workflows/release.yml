name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-release:
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install build wheel twine pybind11
          python -m cutile_forge.baselines.build
          python -m build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheel
          path: dist/*.whl
      - name: Publish to PyPI (when PYPI_TOKEN secret is configured)
        if: ${{ secrets.PYPI_TOKEN != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload dist/* --non-interactive

